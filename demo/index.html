<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gnotif demo</title>
  <style>
    :root { color-scheme: light dark; --fg: #1b1b1f; --muted: #5d5d66; --bg: #fbfbfd; --line: #d9d9e0; --accent: #2f6f4f; --error: #a32020; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ececf1; --muted: #a2a2ad; --bg: #16161a; --line: #34343c; --accent: #7cc7a0; --error: #ff8a8a; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; }
    h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
    h2 { margin: 1.5rem 0 0.5rem; font-size: 1.1rem; }
    p.lead { margin: 0 0 1.5rem; color: var(--muted); }
    label[for="address"] { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    input[type="text"] { box-sizing: border-box; width: 100%; padding: 0.5rem; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
    li label { display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap; }
    .target { color: var(--muted); font-size: 0.875rem; word-break: break-all; }
    .verified { color: var(--accent); font-size: 0.875rem; font-weight: 600; }
    .actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
    button { padding: 0.5rem 1rem; font: inherit; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
    button#enable { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
    #status { min-height: 1.5em; margin-top: 1rem; color: var(--muted); }
    #status.error { color: var(--error); }
  </style>
</head>
<body>
  <main>
    <h1>gnotif</h1>
    <p class="lead">Get a browser notification when a realm event concerns you, even with this tab closed.</p>

    <label for="address">Your gno address</label>
    <input type="text" id="address" placeholder="g1…" autocomplete="off" spellcheck="false">

    <h2>Triggers</h2>
    <ul id="triggers"></ul>

    <div class="actions">
      <button type="button" id="enable">Enable notifications</button>
      <button type="button" id="disable">Disable</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
